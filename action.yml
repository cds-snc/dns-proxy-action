name: "DNS Proxy Action"
description: "Starts a DNS Proxy"
runs:
  using: "composite"
  steps:
    - run: |
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)  BINARY=dns-proxy-action-amd64 ;;
          aarch64) BINARY=dns-proxy-action-arm64 ;;
          *)        echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac
        sudo -E $GITHUB_ACTION_PATH/release/latest/$BINARY > /tmp/dns-proxy-action.out 2>&1 &
      shell: bash
    - run: |
        sleep 3
        failed=false
        if ! pgrep -f 'release/latest/dns-proxy-action-' > /dev/null; then
          failed=true
        elif grep -qE 'Error (writing to|restarting systemd-resolved)' /tmp/dns-proxy-action.out; then
          failed=true
        fi
        if [ "$failed" = true ]; then
          cat /tmp/dns-proxy-action.out
          case "${DNS_PROXY_FAILONERROR,,}" in
            true|t|1)
              echo "::error::DNS proxy is not active"
              exit 1 ;;
            *)
              echo "::warning::DNS proxy is not active; DNS filtering and auditing are disabled for this job" ;;
          esac
        fi
      shell: bash
