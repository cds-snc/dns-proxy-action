on: [issues, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    name: Sync repository labels
    permissions:
      issues: write
    steps:
      - uses: cds-snc/labels@541ac8fb58745998948f0c0ba88101d4036c903a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}