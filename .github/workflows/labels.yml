on: [issues, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    name: Sync repository labels
    permissions:
      issues: write
    steps:
      - uses: cds-snc/labels@8d95ffe4ae0bd4f148da0b5f082f1e5aa6cb72bf # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}